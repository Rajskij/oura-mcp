name: uptime

on:
  schedule:
    # Hourly. GitHub throttles sub-hourly crons on low-activity repos anyway, so
    # a tighter schedule is fiction; hourly is honest and less noisy.
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  issues: write
  actions: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Check healthz
        run: |
          for i in 1 2 3; do
            curl -sf --max-time 10 https://oura-mcp.duckdns.org/healthz > /dev/null && exit 0
            echo "attempt $i failed"
            sleep 20
          done
          exit 1

      # Only page when the outage survives two runs in a row (~an hour), not on a
      # single 40s network blip between the runner and DuckDNS. The previous run's
      # conclusion is the state store — no extra persistence needed.
      - name: File an issue when the outage persists
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          PREV=$(gh run list --workflow uptime.yml --limit 5 \
                  --json status,conclusion \
                  --jq 'first(.[] | select(.status == "completed") | .conclusion) // "none"')
          if [ "$PREV" != "failure" ]; then
            echo "first failing run (previous run was '$PREV') — waiting for a second failure before paging"
            exit 0
          fi
          OPEN=$(gh issue list --label uptime --state open --json number --jq 'length')
          if [ "$OPEN" != "0" ]; then
            echo "uptime issue already open, not filing another"
            exit 0
          fi
          gh issue create \
            --title "Production healthz is down ($(date -u '+%Y-%m-%d %H:%M') UTC)" \
            --label uptime \
            --body "healthz failed on two consecutive uptime runs (each run already retries 3x over ~40s), so this is a real outage, not a blip. Check the box: service status, Caddy, DuckDNS IP, Oracle instance state. Close this issue once resolved."
